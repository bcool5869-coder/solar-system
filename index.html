<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#04060f; overflow:hidden; }
  canvas { display:block; }
  #ui {
    position:fixed; left:16px; top:16px; z-index:2;
    font:13px/1.6 ui-monospace, Menlo, Consolas, monospace;
    color:#9fb3d9; background:rgba(6,10,24,.62);
    border:1px solid rgba(120,160,255,.18); border-radius:10px;
    padding:12px 14px; backdrop-filter:blur(8px); max-width:274px;
  }
  #ui h1 { font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:#e8eeff; margin-bottom:8px; }
  #ui label { display:flex; align-items:center; gap:8px; margin-top:6px; }
  #ui input[type=range] { flex:1; accent-color:#6f9cff; }
  #ui button {
    margin-top:8px; width:100%; cursor:pointer; color:#cfe0ff;
    background:rgba(90,130,255,.14); border:1px solid rgba(120,160,255,.28);
    border-radius:7px; padding:6px 8px; font:inherit;
  }
  #ui button:hover { background:rgba(90,130,255,.26); }
  #clock { margin-top:9px; font-size:11px; color:#7f93bb; }
  #clock b { color:#c9d8f5; font-weight:600; }
  #hint { margin-top:9px; font-size:11px; color:#61759c; }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="ui">
  <h1>Solar System</h1>
  <label>Speed <input id="speed" type="range" min="0" max="400" value="100"></label>
  <label>Zoom <input id="zoom" type="range" min="40" max="220" value="100"></label>
  <button id="toggleView">View: helical (60&deg; tilt)</button>
  <button id="toggleOrbits">Orbit paths: on</button>
  <button id="toggleTrails">Helix trails: on</button>
  <div id="clock"></div>
  <div id="hint">Drag to pan &middot; scroll to zoom</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars();
  }

  // ---- starfield -------------------------------------------------------
  let stars = [];
  function buildStars() {
    const n = Math.round((W * H) / 2600);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.1 + 0.25,
      a: Math.random() * 0.6 + 0.25,
      tw: Math.random() * Math.PI * 2,
      ts: Math.random() * 1.8 + 0.4
    }));
  }

  // ---- bodies ----------------------------------------------------------
  // dist = orbit radius in px, r = draw radius, period = orbital period in years
  const planets = [
    { name:'Mercury', dist: 58,  r: 3.0,  period: 0.24,  color:'#a9a2a0', ring:false },
    { name:'Venus',   dist: 82,  r: 5.4,  period: 0.62,  color:'#e0b072', ring:false },
    { name:'Earth',   dist: 112, r: 5.8,  period: 1.00,  color:'#4b8fe0', ring:false,
      moons:[{ dist: 13, r: 1.7, period: 0.075, color:'#c9c9c9' }] },
    { name:'Mars',    dist: 146, r: 4.2,  period: 1.88,  color:'#c1502e', ring:false,
      moons:[{ dist: 9,  r: 1.0, period: 0.03,  color:'#9a8b80' }] },
    { name:'Jupiter', dist: 212, r: 15,   period: 11.86, color:'#d3a06a', ring:false,
      moons:[{ dist: 23, r: 1.6, period: 0.05,  color:'#d9d2c4' },
             { dist: 31, r: 1.9, period: 0.09,  color:'#b7a58c' }] },
    { name:'Saturn',  dist: 282, r: 12.5, period: 29.45, color:'#e3cb92', ring:true,
      moons:[{ dist: 26, r: 1.7, period: 0.07,  color:'#cdbfa5' }] },
    { name:'Uranus',  dist: 348, r: 8.5,  period: 84.0,  color:'#8fd4dd', ring:true },
    { name:'Neptune', dist: 406, r: 8.2,  period: 164.8, color:'#4a63c8', ring:false }
  ];

  planets.forEach(p => { p.trail = []; });

  // surface blobs on the sun, so its rotation is actually visible
  const granules = Array.from({ length: 26 }, () => {
    const y = (Math.random() * 2 - 1) * 0.82;
    return {
      a: Math.random() * Math.PI * 2,
      y,
      d: Math.sqrt(1 - y * y),          // keep blobs on the sphere, not the corners
      r: Math.random() * 0.16 + 0.07,
      hot: Math.random() < 0.45
    };
  });

  // ---- geometry --------------------------------------------------------
  // Orbits are built as real circles in 3D and then rotated, so the tilt is an
  // actual angle rather than a squashed axis.
  //
  //   tilt = angle between the orbital plane and the sun's direction of travel
  //          through the galaxy. The solar apex sits about 60 deg out of the
  //          ecliptic, which is why the planets corkscrew across the line of
  //          motion instead of trailing flat behind.
  //   cam  = how far the camera is lifted above that line of motion.
  //
  // Screen +x is the direction of travel, so trails stream off to the left.
  const VIEWS = {
    helical: { tilt: 60, cam: 20, label: 'helical (60° tilt)' },
    flat:    { tilt: 0,  cam: 25, label: 'flat (top-down)' }
  };

  let viewName = 'helical';
  let view;
  function setView(name) {
    viewName = name;
    const v = VIEWS[name];
    const th = v.tilt * Math.PI / 180, cm = v.cam * Math.PI / 180;
    view = {
      cosT: Math.cos(th), sinT: Math.sin(th),
      cosC: Math.cos(cm), sinC: Math.sin(cm),
      label: v.label
    };
  }
  setView('helical');

  // a = angle around the orbit, d = orbit radius. Returns screen offset from
  // the centre of the orbit, plus a depth value for painter's-order sorting.
  function project(a, d) {
    const ca = Math.cos(a), sa = Math.sin(a);
    const x =  ca * d * view.cosT;      // tilt about the direction of travel
    const y = -ca * d * view.sinT;
    const z =  sa * d;
    return {
      x,
      y: y * view.cosC - z * view.sinC, // then lift the camera
      depth: y * view.sinC + z * view.cosC
    };
  }

  // ---- controls --------------------------------------------------------
  const speedEl   = document.getElementById('speed');
  const zoomEl    = document.getElementById('zoom');
  const orbitBtn  = document.getElementById('toggleOrbits');
  const viewBtn   = document.getElementById('toggleView');
  const trailBtn  = document.getElementById('toggleTrails');
  const clockEl   = document.getElementById('clock');

  let showOrbits = true;
  let showTrails = true;
  let zoom = 1;
  let panX = 0, panY = 0;
  let dragging = false, lastX = 0, lastY = 0;

  orbitBtn.onclick = () => {
    showOrbits = !showOrbits;
    orbitBtn.textContent = 'Orbit paths: ' + (showOrbits ? 'on' : 'off');
  };
  trailBtn.onclick = () => {
    showTrails = !showTrails;
    trailBtn.textContent = 'Helix trails: ' + (showTrails ? 'on' : 'off');
    if (!showTrails) planets.forEach(p => { p.trail.length = 0; });
  };
  viewBtn.onclick = () => {
    setView(viewName === 'helical' ? 'flat' : 'helical');
    viewBtn.textContent = 'View: ' + view.label;
    planets.forEach(p => { p.trail.length = 0; });
  };
  zoomEl.oninput = () => { zoom = zoomEl.value / 100; };

  canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener('mouseup', () => { dragging = false; });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    panX += e.clientX - lastX; panY += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoom = Math.min(2.2, Math.max(0.4, zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
    zoomEl.value = Math.round(zoom * 100);
  }, { passive:false });

  // touch: one finger pans
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0]; dragging = true; lastX = t.clientX; lastY = t.clientY;
  }, { passive:true });
  canvas.addEventListener('touchmove', e => {
    if (!dragging) return;
    const t = e.touches[0];
    panX += t.clientX - lastX; panY += t.clientY - lastY;
    lastX = t.clientX; lastY = t.clientY;
  }, { passive:true });
  window.addEventListener('touchend', () => { dragging = false; });

  // ---- drawing helpers -------------------------------------------------
  function shade(hex, mul) {
    const n = parseInt(hex.slice(1), 16);
    const c = [n >> 16 & 255, n >> 8 & 255, n & 255]
      .map(v => Math.max(0, Math.min(255, Math.round(v * mul))));
    return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
  }

  function sphere(x, y, r, color, lx, ly) {
    const ang = Math.atan2(ly - y, lx - x);   // lit from the sun's direction
    const g = ctx.createRadialGradient(
      x + Math.cos(ang) * r * 0.38, y + Math.sin(ang) * r * 0.38, r * 0.08,
      x, y, r
    );
    g.addColorStop(0, shade(color, 1.45));
    g.addColorStop(0.55, color);
    g.addColorStop(1, shade(color, 0.28));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // a tilted circle is no longer an axis-aligned ellipse, so trace it
  function ringPath(ox, oy, d, steps) {
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const q = project((i / steps) * Math.PI * 2, d);
      if (i === 0) ctx.moveTo(ox + q.x, oy + q.y);
      else         ctx.lineTo(ox + q.x, oy + q.y);
    }
  }

  function drawRing(x, y, r) {
    ctx.strokeStyle = 'rgba(226,206,160,.55)';
    ctx.lineWidth = Math.max(1, r * 0.28);
    ringPath(x, y, r * 1.85, 40); ctx.stroke();
    ctx.strokeStyle = 'rgba(226,206,160,.22)';
    ctx.lineWidth = Math.max(1, r * 0.16);
    ringPath(x, y, r * 2.35, 40); ctx.stroke();
  }

  // ---- main loop -------------------------------------------------------
  let t = 0, tick = 0, prev = performance.now();
  const TRAIL_MAX = 260;

  function frame(now) {
    const dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    const rate = speedEl.value / 100;
    t += dt * rate * 0.35;                 // t counts in "years"

    // The sun is hauling the whole system round the galactic centre at
    // ~230 km/s. We hold it on screen and let everything else stream past.
    const travel = dt * rate * 34;

    ctx.fillStyle = '#04060f';
    ctx.fillRect(0, 0, W, H);

    // starfield: brighter (nearer) stars slide faster — that parallax is
    // what makes the motion read as motion rather than as a static field
    for (const s of stars) {
      const near = s.r / 1.35;
      s.x -= travel * (0.25 + near);
      if (s.x < -2) { s.x = W + 2; s.y = Math.random() * H; }
      s.tw += dt * s.ts;
      ctx.globalAlpha = s.a * (0.65 + 0.35 * Math.sin(s.tw));
      ctx.fillStyle = '#dce7ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // the sun also wobbles around the barycenter as Jupiter and Saturn pull on it
    const w1 = project((t / 11.86) * Math.PI * 2, 9 * zoom);
    const w2 = project((t / 29.45) * Math.PI * 2, 4 * zoom);
    const cx = W / 2 + panX + w1.x + w2.x;
    const cy = H / 2 + panY + w1.y + w2.y;
    const spin = t * (365 / 25) * Math.PI * 2;   // solar rotation, ~25 days

    if (showOrbits) {
      ctx.strokeStyle = 'rgba(130,165,235,.16)';
      ctx.lineWidth = 1;
      for (const p of planets) { ringPath(cx, cy, p.dist * zoom, 96); ctx.stroke(); }
    }

    // work out where each planet is, and record the helix it leaves behind
    const drawn = planets.map(p => {
      const a = (t / p.period) * Math.PI * 2;
      const q = project(a, p.dist * zoom);
      const x = cx + q.x, y = cy + q.y;

      if (showTrails) {
        // existing trail points fall back as the system advances, which is
        // what turns a closed orbit into an open corkscrew
        for (const s of p.trail) s.x -= travel;
        p.trail.push({ x, y });
        while (p.trail.length > TRAIL_MAX || (p.trail.length && p.trail[0].x < -60)) {
          p.trail.shift();
        }
      }
      return { p, x, y, depth: q.depth };
    }).sort((u, v) => u.depth - v.depth);     // far side first

    if (showTrails) {
      ctx.lineWidth = 1.6;
      for (const p of planets) {
        const tr = p.trail;
        const bright = shade(p.color, 1.25);
        for (let i = 1; i < tr.length; i++) {
          ctx.globalAlpha = 0.12 + (i / tr.length) * 0.62;
          ctx.strokeStyle = bright;
          ctx.beginPath();
          ctx.moveTo(tr[i - 1].x, tr[i - 1].y);
          ctx.lineTo(tr[i].x, tr[i].y);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
    }

    // sun: corona + pulsing core
    const sunR = 26 * zoom;
    const pulse = 1 + 0.035 * Math.sin(now / 520);
    const glow = ctx.createRadialGradient(cx, cy, sunR * 0.2, cx, cy, sunR * 6);
    glow.addColorStop(0,    'rgba(255,220,130,.75)');
    glow.addColorStop(0.18, 'rgba(255,160,50,.22)');
    glow.addColorStop(0.45, 'rgba(255,120,30,.07)');
    glow.addColorStop(1,    'rgba(255,120,30,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, sunR * 6, 0, Math.PI * 2); ctx.fill();

    const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunR * pulse);
    core.addColorStop(0,   '#fffdf0');
    core.addColorStop(0.5, '#ffd75e');
    core.addColorStop(1,   '#ff9314');
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(cx, cy, sunR * pulse, 0, Math.PI * 2); ctx.fill();

    // granulation, carried around by the sun's rotation so the spin is visible
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, sunR * pulse, 0, Math.PI * 2); ctx.clip();
    for (const g of granules) {
      const a = g.a + spin;
      const face = Math.cos(a);                 // <= 0 means it's on the far side
      if (face <= 0) continue;
      ctx.globalAlpha = 0.30 * face;
      ctx.fillStyle = g.hot ? '#fff6c8' : '#e8760f';
      ctx.beginPath();
      ctx.ellipse(cx + Math.cos(a) * g.d * sunR, cy + g.y * sunR,
                  g.r * sunR * face, g.r * sunR, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // planets, far side already sorted to the back
    ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'center';

    for (const { p, x, y } of drawn) {
      const r = p.r * zoom;
      if (p.ring) drawRing(x, y, r);
      sphere(x, y, r, p.color, cx, cy);

      if (p.moons) {
        for (const m of p.moons) {
          const q = project((t / m.period) * Math.PI * 2, m.dist * zoom);
          sphere(x + q.x, y + q.y, Math.max(0.8, m.r * zoom), m.color, x, y);
        }
      }

      ctx.fillStyle = 'rgba(190,210,250,.62)';
      ctx.fillText(p.name, x, y - r - 7);
    }

    if (++tick % 12 === 0) {
      // 230 km/s around the galactic centre; one lap takes ~230 million years
      const km = t * 230 * 3.156e7;
      clockEl.innerHTML =
        'elapsed <b>' + t.toFixed(1) + '</b> yr<br>' +
        'travelled <b>' + km.toExponential(2) + '</b> km<br>' +
        'galactic orbit <b>' + (t / 230e6 * 100).toExponential(1) + '%</b>';
    }

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
